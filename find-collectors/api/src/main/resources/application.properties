server.port=${SERVER_PORT:8080}
management.endpoints.web.exposure.include=health,info

spring.datasource.url=${DATABASE_URL:jdbc:postgresql://localhost:5432/find-collectors}
spring.datasource.username=${POSTGRES_USER:postgres}
spring.datasource.password=${POSTGRES_PASSWORD:postgres}

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false

spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration

springdoc.packages-to-scan=br.fai.findcollectors

security.jwt.secret=${JWT_SECRET}
security.jwt.issuer=find-collectors
security.jwt.access-token-ttl=15m
security.jwt.refresh-token-ttl=7d
