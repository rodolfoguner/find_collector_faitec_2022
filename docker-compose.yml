services:
  database:
    image: postgres:16
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-find-collectors}
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
    ports:
      - "${DB_PORT:-5432}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10
    volumes:
      - find-collectors-data:/var/lib/postgresql/data

volumes:
  find-collectors-data: